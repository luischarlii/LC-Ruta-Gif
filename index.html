<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta a GIF</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#12263a;--paper:#f6f7f4;--line:#d5dad4;--route:#d6246e;--go:#1f9d55;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef4;--paper:#0f1b27;--line:#2a3b4c;--card:#16273a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#bar{display:flex;gap:6px;padding:6px;background:var(--card);border-bottom:1px solid var(--line)}
select,button{font:inherit;color:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:0}
#bar select{flex:1}
#logo{width:36px;height:36px;border-radius:8px;border:2px solid #f5b400;flex:none;align-self:center}
#wrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#side{position:absolute;right:8px;top:8px;z-index:1000;display:flex;flex-direction:column;gap:6px;width:82px}
#side button{width:100%;font-size:14px;font-weight:600;padding:9px 4px;background:var(--card);box-shadow:0 1px 4px #0004;cursor:pointer}
#bO.on{background:var(--go);color:#fff;border-color:var(--go)}
#bD.on{background:var(--route);color:#fff;border-color:var(--route)}
#go{background:var(--ink)!important;color:var(--paper)!important}
#gif{background:var(--route)!important;color:#fff!important}
button:disabled{opacity:.5}
#infowrap{position:relative}
#hint{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0));transform:translateX(-50%);display:none;z-index:5;background:var(--route);color:#fff;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;box-shadow:0 2px 6px #0005;cursor:pointer;white-space:nowrap;animation:flash 1s ease-in-out infinite}
@keyframes flash{0%,100%{opacity:1;transform:translateX(-50%) translateY(0)}50%{opacity:.3;transform:translateX(-50%) translateY(-5px)}}
#info{max-height:30vh;overflow:auto;padding:8px 10px;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom,0))}
#msg{font-size:14px;opacity:.85}
#sum{font-weight:700;margin:4px 0}
ol{margin:0;padding-left:22px}
li{padding:3px 0}
#out #gifimg{max-width:100%;border-radius:8px;margin-top:8px}
#out #dlbtn{margin-top:8px;background:var(--route);color:#fff;border:0;font-weight:600}
.lc-support {
  max-width: 390px;
  margin: 15px auto;
  background: #101827;
  border: 1px solid #34445b;
  border-radius: 12px;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.lc-support-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 14px;
  background: transparent;
  border: 0;
  color: white;
  text-align: left;
  cursor: pointer;
}

.lc-heart {
  color: #d4af37;
  font-size: 25px;
}

.lc-support-text {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.lc-support-text strong {
  font-size: 13px;
}

.lc-support-text small {
  font-size: 11px;
  color: #aebbd0;
}

#lcArrow {
  color: #d4af37;
  font-size: 20px;
}

.lc-support-details {
  border-top: 1px solid #34445b;
  padding: 15px;
  text-align: center;
  font-size: 13px;
}

.lc-bank {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
  font-size: 17px;
}

.lc-bank img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  background: white;
  border-radius: 50%;
  padding: 4px;
}

.lc-clabe {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 10px;
  background: #1f2937;
  border-radius: 8px;
  overflow-wrap: anywhere;
}

#lcCopyBtn {
  background: #d4af37;
  color: #101827;
  border: none;
  border-radius: 7px;
  padding: 9px 13px;
  font-weight: bold;
  cursor: pointer;
}

.lc-thanks {
  color: #f5c542;
  font-weight: bold;
  margin-top: 17px;
}
</style>
</head>
<body>
<script src="https://luischarlii.github.io/LC-Ads/lc-ads.js?v=2" data-app="all"></script>
<div id="bar">
  <img id="logo" alt="LC Ruta GIF">
  <select id="pais"><option value="mx">México</option><option value="us">Estados Unidos</option><option value="ca">Canadá</option></select>
  <select id="edo"></select>
  <select id="mode"><option value="car">Auto</option><option value="foot">A pie</option><option value="bike">Bici</option></select>
</div>
<div id="wrap">
  <div id="map"></div>
  <div id="side">
    <button id="loc" title="Usar mi ubicación">📍 GPS</button>
    <button id="bO" class="on">Desde</button>
    <button id="bD">Hasta</button>
    <button id="go">Ruta</button>
    <button id="gif" disabled>Crear GIF</button>
  </div>
</div>
<div id="infowrap"><div id="hint" role="button"></div>
<div id="info"><div id="msg">Elige estado, pulsa Desde o Hasta y toca el mapa para fijar cada punto.</div><div id="sum"></div><ol id="steps"></ol><div id="out"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const map=L.map('map').setView([19.43,-99.13],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let layer=L.layerGroup().addTo(map), route=null;
const say=t=>$('msg').textContent=t;

const SVC={car:'https://router.project-osrm.org/route/v1/driving/',
 foot:'https://routing.openstreetmap.de/routed-foot/route/v1/foot/',
 bike:'https://routing.openstreetmap.de/routed-bike/route/v1/bike/'};

function gps(){
  return new Promise((ok,no)=>navigator.geolocation
    ? navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude}),()=>no(new Error('No pude obtener tu ubicación. Permite la ubicación (necesita https) o pulsa Desde y toca el mapa.')),{enableHighAccuracy:true,timeout:15000})
    : no(new Error('Este navegador no tiene GPS. Pulsa Desde y toca el mapa.')));
}
const MOD={left:'a la izquierda',right:'a la derecha','slight left':'ligeramente a la izquierda','slight right':'ligeramente a la derecha','sharp left':'cerrado a la izquierda','sharp right':'cerrado a la derecha',straight:'recto',uturn:'en U'};
function fmt(m){return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m'}
function text(s){
  const t=s.maneuver.type,m=MOD[s.maneuver.modifier]||'',n=s.name?' en '+s.name:'';
  let v=t==='depart'?'Sal':t==='arrive'?'Llegaste a tu destino':t==='roundabout'||t==='rotary'?'Entra a la glorieta y sal':t==='turn'||t==='end of road'?'Gira':'Continúa';
  if(t==='arrive') return v;
  return v+(m?' '+m:'')+n+' ('+fmt(s.distance)+')';
}

/* ---- Fijar Desde / Hasta ---- */
let O=null,D=null,tap='o';const pins=L.layerGroup().addTo(map),mk={};
const icon=c=>L.divIcon({className:'',html:'<div style="width:18px;height:18px;border-radius:50%;background:'+c+';border:3px solid #fff;box-shadow:0 0 4px #0008"></div>',iconSize:[18,18],iconAnchor:[9,9]});
function setTap(k){tap=k;$('bO').classList.toggle('on',k==='o');$('bD').classList.toggle('on',k==='d')}
function place(k,p){
  if(k==='o')O=p;else D=p;
  if(mk[k])mk[k].setLatLng([p.lat,p.lon]);
  else{mk[k]=L.marker([p.lat,p.lon],{icon:icon(k==='o'?'#1f9d55':'#d6246e'),draggable:true}).addTo(pins);
    mk[k].on('dragend',()=>{const q=mk[k].getLatLng();pick(k,q.lat,q.lng)})}
  $('bO').textContent='Desde'+(O?' ✓':'');$('bD').textContent='Hasta'+(D?' ✓':'');
}
const label=p=>p?(p.name==='Mi ubicación'&&p.short?'Mi ubicación · '+p.short:(p.name||'punto fijado')):'—';
const desc=()=>'Desde: '+label(O)+'  →  Hasta: '+label(D);
function shortName(j){
  const a=j.address||{};
  const r=a.road||a.pedestrian||a.footway||a.cycleway||a.path||a.residential||a.neighbourhood||a.suburb||a.hamlet||a.village||a.town||a.city||(j.display_name||'').split(',')[0];
  return r+(a.road&&a.house_number?' '+a.house_number:'');
}
function nameFor(k,p){
  return fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&addressdetails=1&accept-language=es&lat='+p.lat+'&lon='+p.lon)
    .then(r=>r.json()).then(j=>{
      if(!j||!j.display_name)return;
      p.short=shortName(j);if(!p.name)p.name=p.short;
      if((k==='o'?O:D)===p)say(desc());
    }).catch(()=>{});
}
function pick(k,lat,lon){
  const p={lat,lon};place(k,p);say(desc());
  nameFor(k,p);
  if(k==='o')setTap('d');
  if(O&&D)calc();
}
map.on('click',e=>pick(tap,e.latlng.lat,e.latlng.lng));
$('bO').onclick=()=>setTap('o');
$('bD').onclick=()=>setTap('d');
$('mode').onchange=()=>{if(O&&D)calc()};
$('loc').onclick=async()=>{
  try{say('Pidiendo tu ubicación…');const q=await gps();const g0={lat:q.lat,lon:q.lon,name:'Mi ubicación'};place('o',g0);nameFor('o',g0);
    map.setView([q.lat,q.lon],15);setTap('d');say(desc());if(D)calc()}
  catch(e){say(e.message)}
};
$('go').onclick=calc;

async function calc(){
  try{
    $('go').disabled=true;$('gif').disabled=true;$('out').innerHTML='';
    if(!D) throw new Error('Pulsa Hasta y toca el mapa para fijar el destino.');
    say('Calculando ruta…');
    let o=O;if(!o){const q=await gps();o={lat:q.lat,lon:q.lon,name:'Mi ubicación'};place('o',o);nameFor('o',o)}
    const d=D;
    const url=SVC[$('mode').value]+o.lon+','+o.lat+';'+d.lon+','+d.lat+'?overview=full&geometries=geojson&steps=true';
    const j=await (await fetch(url)).json();
    if(!j.routes||!j.routes.length) throw new Error('No hay ruta entre esos puntos.');
    const r=j.routes[0];
    route={pts:r.geometry.coordinates.map(c=>[c[1],c[0]]),o,d,dist:r.distance,dur:r.duration};
    layer.clearLayers();
    const line=L.polyline(route.pts,{color:'#d6246e',weight:5}).addTo(layer);
    map.fitBounds(line.getBounds(),{paddingTopLeft:[30,30],paddingBottomRight:[100,30]});
    $('sum').textContent=fmt(r.distance)+' · '+Math.max(1,Math.round(r.duration/60))+' min';
    $('steps').innerHTML='';
    r.legs.forEach(l=>l.steps.forEach(s=>{const li=document.createElement('li');li.textContent=text(s);$('steps').appendChild(li)}));
    say(desc());$('gif').disabled=false;
  }catch(e){say(e.message||'Error de conexión.')}
  $('go').disabled=false;
}

/* ---- País / estado ---- */
const EST={
mx:['Aguascalientes','Baja California','Baja California Sur','Campeche','Chiapas','Chihuahua','Ciudad de México','Coahuila','Colima','Durango','Guanajuato','Guerrero','Hidalgo','Jalisco','Estado de México','Michoacán','Morelos','Nayarit','Nuevo León','Oaxaca','Puebla','Querétaro','Quintana Roo','San Luis Potosí','Sinaloa','Sonora','Tabasco','Tamaulipas','Tlaxcala','Veracruz','Yucatán','Zacatecas'],
us:['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','District of Columbia','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','West Virginia','Wisconsin','Wyoming'],
ca:['Alberta','British Columbia','Manitoba','New Brunswick','Newfoundland and Labrador','Nova Scotia','Ontario','Prince Edward Island','Quebec','Saskatchewan','Northwest Territories','Nunavut','Yukon']};
const PN={mx:'México',us:'United States',ca:'Canada'};
async function fly(q,maxZ){
  try{
    say('Buscando…');
    const j=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes='+$('pais').value+'&q='+encodeURIComponent(q))).json();
    if(!j.length) throw new Error('No encontré "'+q+'".');
    const b=j[0].boundingbox.map(Number);
    map.fitBounds([[b[0],b[2]],[b[1],b[3]]],{maxZoom:maxZ,padding:[20,20]});
    say('Mapa listo. Pulsa Desde o Hasta y toca el mapa.');
  }catch(e){say(e.message||'Error de conexión.')}
}
function fillEdo(){$('edo').innerHTML='<option value="">Estado / provincia</option>'+EST[$('pais').value].map(e=>'<option>'+e+'</option>').join('')}
$('pais').onchange=()=>{fillEdo();fly(PN[$('pais').value],5)};
$('edo').onchange=()=>{if($('edo').value)fly($('edo').value+', '+PN[$('pais').value],10)};
fillEdo();

/* ---- GIF (codificador propio, sin librerías ni workers) ---- */

function lzw(ix){
  const out=[];let cur=0,sh=0;
  const emit=(c,n)=>{cur|=c<<sh;sh+=n;while(sh>=8){out.push(cur&255);cur>>=8;sh-=8}};
  const CLR=256,EOI=257;let size=9,next=258,tab=new Map();
  emit(CLR,size);
  let ib=ix[0];
  for(let i=1;i<ix.length;i++){
    const k=ix[i],key=ib<<8|k,c=tab.get(key);
    if(c===undefined){

      else{if(next>=(1<<size))size++;tab.set(key,next++)}
      ib=k;
    }else ib=c;
  }
  emit(ib,size);emit(EOI,size);
  if(sh>0)out.push(cur&255);
  return out;
}

    for(let i=0;i<d.length;i+=255){const n=Math.min(255,d.length-i);o.push(n);for(let j=0;j<n;j++)o.push(d[i+j])}
    o.push(0);
  });
  o.push(0x3B);
  return new Uint8Array(o);
}
function topColors(d,n){
  const h=new Map();
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const k=((d[i]>>3)<<10)|((d[i+1]>>3)<<5)|(d[i+2]>>3);h.set(k,(h.get(k)||0)+1)}
  return [...h.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>{const k=e[0];return [((k>>10)&31)*8+4,((k>>5)&31)*8+4,(k&31)*8+4]});
}
function buildPal(mapData,logoData){
  const pal=[...topColors(mapData,176),...topColors(logoData,64)];
  [[214,36,110],[31,157,85],[18,38,58],[255,255,255],[245,180,0]].forEach(c=>pal.push(c));
  for(let i=1;i<=5;i++){const t=i/6;pal.push([Math.round(18+237*t),Math.round(38+217*t),Math.round(58+197*t)])}
  while(pal.length<256)pal.push([0,0,0]);
  return pal;
}
function quant(d,pal,cache){
  const n=d.length/4,ix=new Uint8Array(n);
  for(let i=0,p=0;i<n;i++,p+=4){
    const r=d[p],g=d[p+1],b=d[p+2],k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
    let c=cache[k];
    if(c<0){let best=1e9;c=0;
      for(let j=0;j<pal.length;j++){const q=pal[j],e=(q[0]-r)**2+(q[1]-g)**2+(q[2]-b)**2;if(e<best){best=e;c=j}}
      cache[k]=c}
    ix[i]=c;
  }
  return ix;
}
const tick=()=>new Promise(r=>setTimeout(r,0));

const lab=p=>p.short||p.name||(p.lat.toFixed(4)+', '+p.lon.toFixed(4));
function fitTxt(x,t,w){if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
const rr=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
const fmtT=s=>{const m=Math.max(1,Math.round(s/60));return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'};
const TXT={car:'En auto',foot:'A pie',bike:'En bici'};

$('gif').onclick=async()=>{
  if(!route) return;
  $('gif').disabled=true;$('out').innerHTML='';
  try{
    say('Descargando mapa…');
    const TH=H+FH;
    const lats=route.pts.map(p=>p[0]),lons=route.pts.map(p=>p[1]);
    const minLa=Math.min(...lats),maxLa=Math.max(...lats),minLo=Math.min(...lons),maxLo=Math.max(...lons);
    let z=17;
    while(z>2&&(mx(maxLo,z)-mx(minLo,z)>W-80||my(minLa,z)-my(maxLa,z)>H-110)) z--;
    const cx=(mx(minLo,z)+mx(maxLo,z))/2,cy=(my(minLa,z)+my(maxLa,z))/2;
    const ox=cx-W/2,oy=cy-H/2;
    const jobs=[];
    for(let x=Math.floor(ox/T);x<=Math.floor((ox+W)/T);x++)
      for(let y=Math.floor(oy/T);y<=Math.floor((oy+H)/T);y++)
        jobs.push(loadImg('https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png').then(i=>({i,x,y})));
    const [tiles,logo]=await Promise.all([Promise.all(jobs),loadImg(LOGO)]);
    const ly=H+(FH-LS)/2;
    const paint=t=>{
      const c=document.createElement('canvas');c.width=W;c.height=TH;const x=c.getContext('2d');x.imageSmoothingQuality='high';
      x.fillStyle='#e8e8e0';x.fillRect(0,0,W,H);
      if(t)tiles.forEach(e=>e.i&&x.drawImage(e.i,e.x*T-ox,e.y*T-oy));
      if(logo){x.save();x.globalAlpha=.07;x.drawImage(logo,(W-H)/2,0,H,H);x.restore()}
      x.fillStyle='rgba(255,255,255,.8)';x.fillRect(W-130,H-18,130,18);
      x.fillStyle='#333';x.font='11px sans-serif';x.fillText('© OpenStreetMap',W-124,H-5);
      x.fillStyle='#12263a';x.fillRect(0,0,W,38);
      const row=(y,col,tag,p)=>{
        x.fillStyle=col;x.beginPath();x.arc(14,y-4,5,0,7);x.fill();
        x.font='bold 13px sans-serif';x.fillStyle='#f5b400';x.fillText(tag,26,y);
        const tw=x.measureText(tag).width;
        x.fillStyle='#fff';x.fillText(fitTxt(x,lab(p),W-26-tw-12),26+tw,y);
      };
      row(15,'#1f9d55','Desde: ',route.o);row(32,'#d6246e','Hasta: ',route.d);
      x.fillStyle='#12263a';x.fillRect(0,H,W,FH);
      if(logo){x.save();rr(x,8,ly,LS,LS,10);x.clip();x.drawImage(logo,8,ly,LS,LS);x.restore();
        x.lineWidth=2;x.strokeStyle='#f5b400';rr(x,8,ly,LS,LS,10);x.stroke()}
      x.fillStyle='#fff';x.font='13px sans-serif';x.fillText('Imagen creada con',LS+22,H+30);
      x.fillStyle='#f5b400';x.font='bold 22px sans-serif';x.fillText('LC Ruta GIF',LS+22,H+56);
      return c;
    };
    let base=paint(true),note='';
    try{base.getContext('2d').getImageData(0,0,1,1)}
    catch(e){base=paint(false);note=' (sin fondo de mapa: el navegador bloqueó los mosaicos)'}
    let lg=new Uint8ClampedArray(0);
    if(logo){const lc=document.createElement('canvas');lc.width=lc.height=LS;const lx=lc.getContext('2d');lx.drawImage(logo,0,0,LS,LS);lg=lx.getImageData(0,0,LS,LS).data}
    const pal=buildPal(base.getContext('2d').getImageData(0,0,W,H).data,lg);
    const cache=new Int16Array(32768).fill(-1);

    const P=route.pts.map(p=>[mx(p[1],z)-ox,my(p[0],z)-oy]);
    const cum=[0];
    for(let i=1;i<route.pts.length;i++){const a=route.pts[i-1],b=route.pts[i];cum.push(cum[i-1]+Math.hypot((b[1]-a[1])*Math.cos(a[0]*Math.PI/180),b[0]-a[0]))}
    const tot=cum[cum.length-1]||1;
    const N=36,frames=[],delays=[];
    const c=document.createElement('canvas');c.width=W;c.height=TH;const g=c.getContext('2d');
    const dp=(p,col)=>{g.beginPath();g.arc(p[0],p[1],8,0,7);g.fillStyle=col;g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke()};
    for(let f=1;f<=N;f++){
      say('Creando GIF… '+Math.round(f/N*100)+'%'+note);await tick();
      g.drawImage(base,0,0);
      const n=Math.max(2,Math.round(P.length*f/N));
      g.lineJoin=g.lineCap='round';g.lineWidth=5;g.strokeStyle='#d6246e';
      g.beginPath();P.slice(0,n).forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
      dp(P[0],'#1f9d55');dp(P[n-1],f===N?'#d6246e':'#12263a');
      const cov=route.dist*cum[n-1]/tot;
      g.textAlign='right';g.fillStyle='#fff';g.font='bold 24px sans-serif';
      g.fillText(f===N?fmt(route.dist):fmt(cov)+' / '+fmt(route.dist),W-12,H+34);
      g.font='13px sans-serif';g.fillText((TXT[$('mode').value]||'Ruta')+' · aprox. '+fmtT(route.dur),W-12,H+56);
      g.textAlign='left';
      frames.push(quant(g.getImageData(0,0,W,TH).data,pal,cache));
      delays.push(f===N?200:9);
    }
    const bytes=encodeGif(frames,pal.flat(),delays,W,TH);
    const u=URL.createObjectURL(new Blob([bytes],{type:'image/gif'}));
    $('out').innerHTML='<img id="gifimg" src="'+u+'" alt="Ruta animada"><br><a download="ruta.gif" href="'+u+'"><button id="dlbtn" type="button">Descargar GIF</button></a><div id="msg2" style="font-size:14px;opacity:.85;margin-top:6px">Si no se descarga, mantén presionada la imagen para guardarla.</div>';
    $('out').insertAdjacentHTML('beforeend',DONA_HTML);initDona();
    say('GIF listo.'+note);
  }catch(e){say('No se pudo crear el GIF: '+(e.message||'error'))}
  $('gif').disabled=false;
};
const DONA_HTML=`<div class="lc-support">
  <button id="lcDonateBtn" class="lc-support-trigger"
          aria-expanded="false">
    <span class="lc-heart">♡</span>
    <span class="lc-support-text">
      <strong>Te Gustaria Apoyar LC Radio Universal</strong>
      <small>Donaciones voluntarias</small>
    </span>

  <div id="lcDonationDetails" class="lc-support-details" hidden>

</div>`;
function initDona(){
  const clabe=atob("NzIyOTY5MDEwMDYxNDczNTgw");
  const trigger=$('lcDonateBtn'),details=$('lcDonationDetails'),arrow=$('lcArrow'),copy=$('lcCopyBtn');
  trigger.addEventListener('click',()=>{
    const opening=details.hidden;
    details.hidden=!opening;
    trigger.setAttribute('aria-expanded',String(opening));
    arrow.textContent=opening?'⌃':'⌄';
    setTimeout(updHint,0);
  });
  copy.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(clabe);copy.textContent='¡Copiada!'}
    catch(e){copy.textContent='Copia manualmente'}
  });
}
function updHint(){
  const i=$('info'),h=$('hint'),im=$('gifimg');let show;
  if(im){show=im.getBoundingClientRect().top>i.getBoundingClientRect().bottom-60;h.textContent='▲ Imagen creada abajo'}
  else{show=i.scrollHeight-i.scrollTop-i.clientHeight>12;h.textContent='▲ Más abajo'}
  h.style.display=show?'block':'none';
}
$('hint').onclick=()=>{
  const i=$('info'),im=$('gifimg');
  const top=im?im.getBoundingClientRect().top-i.getBoundingClientRect().top+i.scrollTop-8:i.scrollHeight;
  i.scrollTo({top,behavior:'smooth'});
};
$('info').addEventListener('scroll',updHint);
$('info').addEventListener('load',updHint,true);
addEventListener('resize',updHint);
new MutationObserver(updHint).observe($('info'),{childList:true,subtree:true,characterData:true});
function runIntegrityGuard(){
  const adsOk=!!document.querySelector('script[src="https://luischarlii.github.io/LC-Ads/lc-ads.js?v=2"]');
  const donaOk=['lcDonateBtn','lcDonationDetails','lcClabe','Mercado Pago','LC Radio Universal'].every(k=>DONA_HTML.includes(k));
  const clabeOk=initDona.toString().includes('NzIyOTY5MDEwMDYxNDczNTgw');
  if(adsOk&&donaOk&&clabeOk)return;
  const fail=()=>say('No se pudo completar la operación: faltan archivos o recursos del proyecto. Revisa que copiaste todos los archivos e intenta de nuevo.');
  $('go').onclick=fail;$('gif').onclick=fail;
}
runIntegrityGuard();
$('logo').src=LOGO;
['icon','apple-touch-icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=LOGO;document.head.appendChild(l)});
</script>
